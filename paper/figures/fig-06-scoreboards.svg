<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img">
<rect width="880" height="320" fill="#faf8f5"/>
<text x="40.0" y="24.0" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#57534e" text-anchor="start" font-weight="normal">Four boards. Do not stack B into A. Naming pass still required for paid names in C.</text>
<rect x="40" y="40" width="380" height="110" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="56.0" y="68.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1c1917" text-anchor="start" font-weight="bold">A. Application census</text>
<text x="56.0" y="92.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">298 applications</text>
<text x="56.0" y="112.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">14 interviewed</text>
<text x="56.0" y="132.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">rate 14/298</text>
<rect x="460" y="40" width="380" height="110" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="476.0" y="68.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1c1917" text-anchor="start" font-weight="bold">B. Opportunity</text>
<text x="476.0" y="92.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">outside the 14</text>
<text x="476.0" y="112.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">not added to the rate</text>
<text x="476.0" y="132.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">overlay tagged memory</text>
<rect x="40" y="170" width="380" height="110" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="56.0" y="198.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1c1917" text-anchor="start" font-weight="bold">C. Money</text>
<text x="56.0" y="222.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">listed beside the rate</text>
<text x="56.0" y="242.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">marketplace rows sit in A</text>
<text x="56.0" y="262.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">without conversion</text>
<rect x="460" y="170" width="380" height="110" fill="#fff" stroke="#1e3a5f" stroke-width="1.5"/>
<text x="476.0" y="198.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1c1917" text-anchor="start" font-weight="bold">D. Communal</text>
<text x="476.0" y="222.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">not jobs</text>
<text x="476.0" y="242.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">not a pipeline</text>
<text x="476.0" y="262.0" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#57534e" text-anchor="start" font-weight="normal">not a rate</text>
</svg>
